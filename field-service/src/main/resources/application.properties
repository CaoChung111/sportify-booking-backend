quarkus.http.port=8082
quarkus.application.name=field-service

quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/field_db
quarkus.datasource.username=root
quarkus.datasource.password=123456

quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

quarkus.oidc.auth-server-url=http://localhost:8180/realms/sportify
quarkus.oidc.client-id=field-service
quarkus.oidc.application-type=service

quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Field Service API
quarkus.smallrye-openapi.info-version=1.0.0

%dev.quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/field_db
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.oidc.enabled=false
