# ─── Server ───────────────────────────────────────────────────────────────────
quarkus.http.port=8082
quarkus.application.name=field-service

# ─── Database ─────────────────────────────────────────────────────────────────
quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3307/field_db
quarkus.datasource.username=sportify
quarkus.datasource.password=sportify123

# ─── Hibernate ORM ────────────────────────────────────────────────────────────
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false

# ─── Flyway ───────────────────────────────────────────────────────────────────
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# ─── OIDC ─────────────────────────────────────────────────────────────────────
quarkus.oidc.auth-server-url=http://localhost:8180/realms/sportify
quarkus.oidc.client-id=field-service
quarkus.oidc.application-type=service

# ─── OpenAPI ──────────────────────────────────────────────────────────────────
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Field Service API
quarkus.smallrye-openapi.info-version=1.0.0

# ─── Dev ──────────────────────────────────────────────────────────────────────
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.oidc.enabled=false
