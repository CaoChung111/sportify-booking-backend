quarkus.http.port=8085
quarkus.application.name=ai-service

gemini.api-key=${GEMINI_API_KEY:placeholder-key}
gemini.model=gemini-3.5-flash-lite
gemini.embedding-model=gemini-embedding-001
gemini.max-history-size=20

quarkus.rest-client.field-service.url=http://localhost:8082
quarkus.rest-client.field-service.scope=jakarta.inject.Singleton

quarkus.rest-client.booking-service.url=http://localhost:8083
quarkus.rest-client.booking-service.scope=jakarta.inject.Singleton

# ── OIDC ──────────────────────────────────────────────────────────────────────
quarkus.oidc.auth-server-url=http://localhost:8180/realms/sportify
quarkus.oidc.client-id=ai-service
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles

# ── Logging ───────────────────────────────────────────────────────────────────
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n
quarkus.log.level=INFO
quarkus.log.category."com.sportify".level=DEBUG

# ── Swagger ───────────────────────────────────────────────────────────────────
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Sportify AI Service API
quarkus.smallrye-openapi.info-version=1.0.0

# ── Dev Profile ───────────────────────────────────────────────────────────────
%dev.quarkus.oidc.enabled=false
%dev.quarkus.log.category."com.sportify".level=DEBUG
