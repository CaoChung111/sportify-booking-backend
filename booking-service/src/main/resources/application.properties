# ── Booking Auto-Cancel Config ─────────────────────────────────────────────────
# Số phút tối đa một booking PENDING được giữ trước khi bị tự động huỷ.
# Scheduler chạy mỗi 1 phút để quét và cập nhật.
booking.pending.expire-minutes=15

