quarkus.http.port=8083
quarkus.application.name=booking-service

# CORS — cho phép frontend gọi SSE endpoints trực tiếp
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:5173
quarkus.http.cors.headers=Authorization,Content-Type,Accept,Cache-Control,X-User-Id
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/booking_db
quarkus.datasource.username=root
quarkus.datasource.password=123456

quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

quarkus.oidc.auth-server-url=http://localhost:8180/realms/sportify
quarkus.oidc.client-id=booking-service
quarkus.oidc.credentials.secret=kE4Tv9u1nQ4A5lSO9JeyMCBbszZPAVEk
quarkus.oidc.application-type=service

quarkus.oidc.roles.role-claim-path=realm_access/roles
field-service/mp-rest/url=http://localhost:8082
field-service/mp-rest/scope=jakarta.inject.Singleton
payment-service/mp-rest/url=http://localhost:8084
payment-service/mp-rest/scope=jakarta.inject.Singleton

quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Booking Service API
quarkus.smallrye-openapi.info-version=1.0.0

%dev.quarkus.hibernate-orm.database.generation=none
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.flyway.clean-at-start=true
#%dev.quarkus.oidc.enabled=false
%dev.field-service/mp-rest/url=http://localhost:8082
%dev.payment-service/mp-rest/url=http://localhost:8084

booking.pending.expire-minutes=15

# %dev.booking.pending.expire-minutes=2
