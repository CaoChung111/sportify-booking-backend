# ─── Server ───────────────────────────────────────────────────────────────────
quarkus.http.port=8081
quarkus.application.name=auth-service

# ─── Database ─────────────────────────────────────────────────────────────────
quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/auth_db
quarkus.datasource.username=root
quarkus.datasource.password=123456

# ─── Hibernate ORM ────────────────────────────────────────────────────────────
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

quarkus.oidc.auth-server-url=http://localhost:8180/realms/sportify
quarkus.oidc.client-id=auth-service
quarkus.oidc.application-type=service

quarkus.keycloak.admin-client.server-url=http://localhost:8180
quarkus.keycloak.admin-client.realm=sportify
quarkus.keycloak.admin-client.client-id=auth-service
quarkus.keycloak.admin-client.client-secret=G4VXi4GAijft1d9c7lKtxTrbiYm7m2lO
quarkus.keycloak.admin-client.grant-type=CLIENT_CREDENTIALS

quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Auth Service API
quarkus.smallrye-openapi.info-version=1.0.0

keycloak.public-client-id=sportify-app

%dev.quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/auth_db
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.oidc.enabled=false
%dev.keycloak.public-client-id=sportify-app
