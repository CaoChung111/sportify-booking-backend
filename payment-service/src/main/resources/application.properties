# ─── Server ───────────────────────────────────────────────────────────────────
quarkus.http.port=8084
quarkus.application.name=payment-service

# ─── Database ─────────────────────────────────────────────────────────────────
quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/payment_db
quarkus.datasource.username=root
quarkus.datasource.password=123456

# ─── Hibernate ORM ────────────────────────────────────────────────────────────
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false

# ─── Flyway ───────────────────────────────────────────────────────────────────
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# ─── OIDC ─────────────────────────────────────────────────────────────────────
quarkus.oidc.auth-server-url=http://localhost:8180/realms/sportify
quarkus.oidc.client-id=payment-service
quarkus.oidc.application-type=service

# ─── REST Client → booking-service ────────────────────────────────────────────
booking-service/mp-rest/url=http://localhost:8083
booking-service/mp-rest/scope=jakarta.inject.Singleton

# ─── Payment Gateway Config ───────────────────────────────────────────────────
vnpay.tmn-code=YOUR_TMN_CODE
vnpay.hash-secret=YOUR_HASH_SECRET
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:8084/api/v1/payments/vnpay/callback

momo.partner-code=YOUR_PARTNER_CODE
momo.access-key=YOUR_ACCESS_KEY
momo.secret-key=YOUR_SECRET_KEY
momo.endpoint=https://test-payment.momo.vn/v2/gateway/api/create

# ─── OpenAPI ──────────────────────────────────────────────────────────────────
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Payment Service API
quarkus.smallrye-openapi.info-version=1.0.0

# ─── Dev ──────────────────────────────────────────────────────────────────────
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.oidc.enabled=false
%dev.booking-service/mp-rest/url=http://localhost:8083
