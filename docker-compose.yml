version: '3.8'

networks:
  sportify-net:
    driver: bridge

volumes:
  auth_db_data:
  field_db_data:
  booking_db_data:
  payment_db_data:
  keycloak_db_data:

services:

  # ─────────────────────────────────────────
  # DATABASES
  # ─────────────────────────────────────────
  auth-db:
    image: mysql:8.0
    container_name: sportify-auth-db
    environment:
      MYSQL_DATABASE: auth_db
      MYSQL_USER: sportify
      MYSQL_PASSWORD: sportify123
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - auth_db_data:/var/lib/mysql
    networks:
      - sportify-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  field-db:
    image: mysql:8.0
    container_name: sportify-field-db
    environment:
      MYSQL_DATABASE: field_db
      MYSQL_USER: sportify
      MYSQL_PASSWORD: sportify123
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - field_db_data:/var/lib/mysql
    networks:
      - sportify-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  booking-db:
    image: mysql:8.0
    container_name: sportify-booking-db
    environment:
      MYSQL_DATABASE: booking_db
      MYSQL_USER: sportify
      MYSQL_PASSWORD: sportify123
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3308:3306"
    volumes:
      - booking_db_data:/var/lib/mysql
    networks:
      - sportify-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-db:
    image: mysql:8.0
    container_name: sportify-payment-db
    environment:
      MYSQL_DATABASE: payment_db
      MYSQL_USER: sportify
      MYSQL_PASSWORD: sportify123
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3309:3306"
    volumes:
      - payment_db_data:/var/lib/mysql
    networks:
      - sportify-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # KEYCLOAK
  # ─────────────────────────────────────────
  keycloak-db:
    image: postgres:16-alpine
    container_name: sportify-keycloak-db
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - sportify-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: sportify-keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
    ports:
      - "8180:8080"
    depends_on:
      - keycloak-db
    networks:
      - sportify-net

  # ─────────────────────────────────────────
  # MICROSERVICES
  # ─────────────────────────────────────────
  auth-service:
    build:
      context: ./auth-service
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: sportify-auth-service
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:mysql://auth-db:3306/auth_db
      QUARKUS_DATASOURCE_USERNAME: sportify
      QUARKUS_DATASOURCE_PASSWORD: sportify123
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/sportify
    ports:
      - "8081:8081"
    depends_on:
      auth-db:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - sportify-net

  field-service:
    build:
      context: ./field-service
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: sportify-field-service
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:mysql://field-db:3306/field_db
      QUARKUS_DATASOURCE_USERNAME: sportify
      QUARKUS_DATASOURCE_PASSWORD: sportify123
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/sportify
      QUARKUS_HTTP_PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      field-db:
        condition: service_healthy
    networks:
      - sportify-net

  booking-service:
    build:
      context: ./booking-service
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: sportify-booking-service
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:mysql://booking-db:3306/booking_db
      QUARKUS_DATASOURCE_USERNAME: sportify
      QUARKUS_DATASOURCE_PASSWORD: sportify123
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/sportify
      QUARKUS_REST_CLIENT_FIELD_SERVICE_URL: http://field-service:8082
      QUARKUS_HTTP_PORT: 8083
    ports:
      - "8083:8083"
    depends_on:
      booking-db:
        condition: service_healthy
      field-service:
        condition: service_started
    networks:
      - sportify-net

  payment-service:
    build:
      context: ./payment-service
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: sportify-payment-service
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:mysql://payment-db:3306/payment_db
      QUARKUS_DATASOURCE_USERNAME: sportify
      QUARKUS_DATASOURCE_PASSWORD: sportify123
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/sportify
      QUARKUS_REST_CLIENT_BOOKING_SERVICE_URL: http://booking-service:8083
      VNPAY_TMN_CODE: ZKTAL3T1
      VNPAY_HASH_SECRET: GPYEKL2WXS5HMXGKNCETX7713DUQ86E7
      VNPAY_RETURN_URL: http://localhost:8084/api/v1/payments/vnpay/callback
      QUARKUS_HTTP_PORT: 8084
    ports:
      - "8084:8084"
    depends_on:
      payment-db:
        condition: service_healthy
      booking-service:
        condition: service_started
    networks:
      - sportify-net

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: sportify-api-gateway
    environment:
      QUARKUS_REST_CLIENT_AUTH_SERVICE_URL: http://auth-service:8081
      QUARKUS_REST_CLIENT_FIELD_SERVICE_URL: http://field-service:8082
      QUARKUS_REST_CLIENT_BOOKING_SERVICE_URL: http://booking-service:8083
      QUARKUS_REST_CLIENT_PAYMENT_SERVICE_URL: http://payment-service:8084
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/sportify
      QUARKUS_HTTP_PORT: 8080
    ports:
      - "8090:8080"
    depends_on:
      - auth-service
      - field-service
      - booking-service
      - payment-service
    networks:
      - sportify-net
